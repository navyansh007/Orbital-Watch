# Cloudflare Pages project config.
#
# The site is a static Vite bundle in dist/; the two data proxies in functions/
# are picked up automatically as Pages Functions and run on the Workers runtime.
name = "orbital-watch"
pages_build_output_dir = "dist"
# Must not be in the future: the Workers runtime rejects a date it does not yet
# know about, which fails the build rather than degrading.
compatibility_date = "2026-09-01"
